<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Apex Dental · Online scheduling demo by Wolf Softwares</title>

<style>
/* Layout: white, single light theme. App bar with two views (patient booking / front desk) + a customize drawer. Clinic brand color is a live token. */
:root{
  --brand:#0F2140; --brand-ink:#FFFFFF; --gold:#B08743; --gold-soft:#D4B373;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#0F2140; --muted:#5E6B6C; --faint:#94A0A1; --line:#E6EBEB; color-scheme:light;
  --ok:#15803D; --ok-bg:#E8F6EE; --warn:#B45309; --warn-bg:#FDF3E3; --bad:#B91C1C; --bad-bg:#FDECEC; --info:#1D4ED8; --info-bg:#EAF0FE;
  --shadow:0 1px 2px rgba(16,32,34,.06),0 8px 24px rgba(16,32,34,.06);
  --f-display:ui-serif,"Iowan Old Style",Georgia,Cambria,"Times New Roman",serif;
  --f-body:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
  --tint:color-mix(in srgb,var(--brand) 7%,#FFFFFF);
  --tint-2:color-mix(in srgb,var(--brand) 13%,#FFFFFF);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* demo ribbon + app bar */
.ribbon{background:var(--ink);color:var(--bg);font-size:12.5px}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.ribbon b{font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15}
.brand-sub{font-size:12.5px;color:var(--muted)}
.demo-pill{vertical-align:2px;font-family:var(--f-body)}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.icon-btn:hover{border-color:var(--brand)}
.icon-btn svg{width:18px;height:18px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--f-body);background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;border-radius:9px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .pill.brand{background:var(--tint-2);color:var(--ink)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
main{padding-block:24px 64px}
[hidden]{display:none!important}

/* ---------- PATIENT BOOKING ---------- */
.book-col{max-width:600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stage>*{min-width:0}
.bk-tools{display:flex;align-items:center;gap:14px;justify-content:space-between}
.hint{margin:0;font-size:13.5px;color:var(--muted);min-width:0}
.hint b{color:var(--ink);font-weight:600}
.seg.mini{flex:none;padding:2px}.seg.mini button{padding:6px 10px;display:grid;place-items:center}.seg.mini svg{width:18px;height:18px}
.when-line{margin:-4px 0 14px}
.done{text-align:center;padding:8px 0 18px}.done .done-ic{margin:0 auto 12px}.done h2{font-size:22px}.done .note{margin-top:4px}
.done-when{font-family:var(--f-display);font-weight:700;font-size:18px;margin:10px 0 0}
.stage{display:flex;justify-content:center}
.bk{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.bk-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.bk-head h1{font-size:22px}
.bk-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;margin-top:14px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--brand)}
.bk-body{padding:18px 22px 22px}
.bk-q{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 12px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand);background:var(--tint)}
.opt .ic{width:40px;height:40px;border-radius:50%;background:var(--tint);display:grid;place-items:center;flex:none;color:var(--brand)}
.opt .ic svg{width:22px;height:22px}
.opt b{display:block;font-family:var(--f-body);font-weight:700;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt .meta{margin-left:auto;text-align:right;flex:none;font-size:12.5px;color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-body);color:var(--brand-ink);background:var(--brand);flex:none}
.av.alt{background:color-mix(in srgb,var(--brand) 55%,#334155)} .av.alt2{background:color-mix(in srgb,var(--brand) 40%,#7C3AED)}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;margin-bottom:14px}
.date{flex:none;width:64px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;text-align:center}
.date small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.date b{display:block;font-family:var(--f-body);font-size:19px}
.date i{display:block;font-style:normal;font-size:11px;color:var(--faint)}
.date[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.date[aria-pressed="true"] small,.date[aria-pressed="true"] i{color:inherit;opacity:.85}
.date:disabled{opacity:.4}
.slot-group{margin-bottom:14px}
.slot-group .label{margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:600;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--brand)}
.slot[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2)}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--brand)}
.summary{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;font-size:14px}
.summary div{display:flex;justify-content:space-between;gap:12px}
.summary span{color:var(--muted)}
.summary b{text-align:right}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.fill{border:0;background:none;color:var(--brand);font-weight:700;padding:0}
.done-ic{width:58px;height:58px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.done-ic svg{width:30px;height:30px}
.msgs{display:grid;gap:12px;margin-top:16px}
.sms{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.sms .from{font-size:12px;color:var(--faint);margin-bottom:6px}
.bubble{background:color-mix(in srgb,var(--muted) 14%,var(--surface));border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14px;max-width:420px}
.email{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.email-top{background:var(--brand);color:var(--brand-ink);padding:10px 14px;font-weight:700;font-family:var(--f-display)}
.email-b{padding:12px 14px;background:var(--surface)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* phone frame */
.phone{width:390px;max-width:100%;border:10px solid #0d1416;border-radius:46px;box-shadow:0 30px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;background:var(--surface)}
.phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:#0d1416;z-index:2}
.phone .bk{border:0;border-radius:0;box-shadow:none;max-width:none;max-height:760px;overflow-y:auto}
.phone .bk-head{padding-top:46px}
.phone .form{grid-template-columns:1fr}
/* how it works side panel */
.how{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:90px}
.how h2{font-size:16px;margin-bottom:4px}
.how p{color:var(--muted);font-size:14px;margin:0 0 12px}
.how ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:flex;gap:10px;font-size:14px}
.how li svg{width:18px;height:18px;flex:none;color:var(--brand);margin-top:2px}
.how .now{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}

/* ---------- FRONT DESK ---------- */
.fd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.fd-top h1{font-size:24px;margin-right:auto}
.daynav{display:flex;align-items:center;gap:6px}
.daynav b{text-align:center;font-family:var(--f-display)}
.cal-wrap{position:relative}
.cal-btn{display:inline-flex;align-items:center;gap:8px;min-width:200px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:15px}
.cal-btn:hover,.cal-btn[aria-expanded="true"]{border-color:var(--brand)}
.cal-btn svg{width:18px;height:18px;color:var(--gold)}
.cal-btn .caret{font-size:11px;color:var(--muted)}
.cal-pop{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:40;width:310px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(15,33,64,.18);padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h .icon-btn{padding:6px 8px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w span{font-size:11.5px;color:var(--faint);text-align:center;padding:4px 0;font-weight:600}
.cal-d{position:relative;border:0;background:none;border-radius:10px;height:38px;font-weight:600;font-variant-numeric:tabular-nums}
.cal-d:hover:not(:disabled){background:var(--tint)}
.cal-d:disabled{color:var(--faint);opacity:.5;cursor:default}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-d[aria-pressed="true"]{background:var(--brand);color:#fff}
.cal-d i{position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.cal-f{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cal-f span{display:flex;align-items:center;gap:6px}
@media (max-width:640px){.cal-btn{min-width:0}.cal-pop{position:fixed;top:auto;left:12px;right:12px;width:auto;transform:none;margin-top:8px}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:14px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi i{font-style:normal;font-size:12.5px;color:var(--faint)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtab{border:0;background:none;padding:10px 14px;font-weight:700;font-family:var(--f-display);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.subtab .pill{margin-left:6px}
.fd-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1060px){.fd-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px}
.sched-scroll{overflow-x:auto}
.sched{display:grid;min-width:640px;position:relative}
.sched-head{display:grid;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sched-head div{padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.sched-head .av{width:30px;height:30px;font-size:12px}
.sched-head b{display:block;font-size:13.5px;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-head small{display:block;font-size:12px;color:var(--muted)}
.sched-body{display:grid;position:relative}
.tcol{position:relative;border-right:1px solid var(--line)}
.tcol span{position:absolute;right:8px;font-size:11.5px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.pcol{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.pcol:last-child{border-right:0}
.lunch{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);color:var(--faint);font-size:11.5px;display:flex;align-items:center;justify-content:center}
.appt{position:absolute;left:5px;right:5px;border-radius:9px;padding:5px 8px 5px 11px;border:1px solid var(--line);background:var(--surface);text-align:left;overflow:hidden;font-size:12.5px;line-height:1.3;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.appt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.appt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.st-checked-in{background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.appt.st-no-show{opacity:.55;text-decoration:line-through}
.appt.st-completed{opacity:.7}
.appt.st-unconfirmed{border-style:dashed}
.appt.fresh{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent);animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--brand) 18%,transparent)}}
.appt .tags{position:absolute;top:5px;right:6px;display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:1}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.feed{list-style:none;margin:0;padding:6px 0;max-height:640px;overflow:auto}
.feed li{display:flex;gap:10px;padding:10px 16px;font-size:13.5px}
.feed li+li{border-top:1px solid var(--line)}
.feed .fi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint-2);color:var(--brand)}
.feed .fi svg{width:16px;height:16px}
.feed time{display:block;font-size:12px;color:var(--faint)}
.feed li.fresh{background:var(--tint)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rem-list{list-style:none;margin:0;padding:0}
.rem{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
@media (max-width:640px){.rem{grid-template-columns:1fr}}
.rem .when{font-family:var(--f-display);font-weight:700;font-size:14px}
.rem .when small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12.5px}
.rem p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:24px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(18px)}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(5,12,13,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;box-shadow:-20px 0 50px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:18px}
.drawer-b{padding:18px 20px;overflow:auto;display:grid;gap:14px;align-content:start}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.foot{color:var(--faint);font-size:12.5px;text-align:center;padding-block:10px 28px}
@media (max-width:640px){.cust-l{display:none}.tabs{order:3;width:100%}.tab{flex:1}.brand-sub{display:none}}

/* ---------- Apex additions ---------- */
.ribbon{background:var(--brand);color:#F3EBDD;font-size:13px}
.ribbon .wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding-block:8px;flex-wrap:wrap;text-align:center}
.ribbon b{color:var(--gold-soft);font-weight:600}
.ribbon a{color:#fff}
.logo{background:var(--brand);color:var(--gold-soft)}
.logo .mono{font-family:var(--f-display);font-weight:700;font-size:19px}
.steps span.on{background:var(--gold)}
.opt .ic.gold{background:color-mix(in srgb,var(--gold) 14%,#fff);color:var(--gold)}
.fee{display:inline-block;font-size:11.5px;font-weight:600;color:#7A5A22;background:#F6EEDD;border-radius:999px;padding:1px 8px;margin-top:3px}
.pay{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2)}
.pay-row{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:4px 0}
.pay-row b{font-variant-numeric:tabular-nums}
.pay-total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700}
.card-mock{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;display:grid;gap:8px}
.card-mock .cm-line{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.card-mock .cm-num{color:var(--ink);letter-spacing:.06em}
.secure{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
.clinic-sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.clinic-sw button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.clinic-sw button[aria-pressed="true"]{background:var(--brand);color:#fff}
.fd-top{flex-wrap:wrap;gap:12px}
.apex-logo{height:40px;width:auto;flex:none}
@media (max-width:640px){.apex-logo{height:30px}}
.sample-note{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#F6EEDD;color:#5C4319;font-size:14px}
.sample-note b{color:#3E2C0E}
.prep-card{scroll-margin-top:110px;margin-top:16px;border:1px solid color-mix(in srgb,var(--gold) 45%,#fff);background:#FBF7EF;border-radius:14px;padding:16px}
.prep-card h3{font-size:17px;margin:0 0 4px}
.prep-card p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.prep-q .bk-q{margin-bottom:4px}.prep-q .note{margin:0 0 12px}
.prep-q .opt[aria-pressed="true"]{border-color:var(--brand);background:var(--tint-2)}
.prep-q .opt .tick{margin-left:auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.prep-q .opt[aria-pressed="true"] .tick{background:var(--brand);border-color:var(--brand)}
.prep-q .opt .tick svg{width:14px;height:14px}
.prep-sum{display:grid;gap:6px;margin:10px 0 0;font-size:14px}
.prep-sum div{display:grid;grid-template-columns:150px 1fr;gap:10px}
.prep-sum span{color:var(--muted)}
.prep-ask{margin:12px 0 0;padding-left:18px;font-size:14px}
.prep-ask li+li{margin-top:4px}
@media (max-width:520px){.prep-sum div{grid-template-columns:1fr;gap:0}}

h1,h2,h3,h4{font-weight:600}
</style>
</head>

/* ---------- availability ---------- */
function freeSlots(day, typeId, pid, clinic = UI.b.clinic || 'tp') {
  const h = hours(day, clinic); if (!h) return [];
  if (h.emergOnly && typeId !== 'emerg') return [];
  const t = typeById(typeId), dur = t.dur;
  const provs = S.settings.providers.filter((p) => p.clinic === clinic && p.types.includes(typeId) && (!pid || p.id === pid));
  const now = Date.now(), out = new Map();
  for (const p of provs) {
    const busy = S.appts.filter((a) => a.pid === p.id && a.status !== 'cancelled' && sameDay(new Date(a.start), day));
    for (let m = h.open; m + dur <= h.close; m += 15) {
      if (m % 30 && typeId !== 'emerg') continue;
      if (h.emergOnly && m % 30) continue;
      if (h.lunch && m < h.lunch[1] && m + dur > h.lunch[0]) continue;
      const s = atMin(day, m).getTime(), e = s + dur * 6e4;
      if (s < now + 60 * 6e4) continue;
      if (busy.some((a) => s < a.start + a.dur * 6e4 && e > a.start)) continue;
      if (!out.has(m)) out.set(m, p.id);
    }
  }
  return [...out.entries()].sort((a, b) => a[0] - b[0]).map(([m, p]) => ({ m, pid: p }));
}
function firstAvailable(typeId, pid) {
  for (let k = 0; k < 21; k++) { const d = addDays(today0, k); const s = freeSlots(d, typeId, pid); if (s.length) return { day: d, slot: s[0] }; }
  return null;
}

      const PX = 1.3, top = h.open, H = (h.close - h.open) * PX;
      const cols = `56px repeat(${ps.length}, minmax(180px,1fr))`;
      const ticks = []; for (let m = h.open; m <= h.close; m += 60) ticks.push(`<span style="top:${(m - top) * PX}px">${fmtTime(atMin(day, m))}</span>`);
      const nowM = minOf(new Date());
      const nowLine = isToday && nowM > h.open && nowM < h.close ? `<div class="nowline" style="top:${(nowM - top) * PX}px;grid-column:2/-1"></div>` : '';
      content = `<div class="fd-grid"><div class="panel"><div class="panel-h"><h2>${clinicById(cl).name} · ${fmtLong(day)}</h2><span class="note">${h.emergOnly ? 'Sunday: emergency times only' : 'Click a visit to check in or confirm'}</span></div>
        <div class="sched-scroll"><div class="sched">
          <div class="sched-head" style="grid-template-columns:${cols}"><div></div>${ps.map((p, i) => `<div><span class="av ${['', 'alt', 'alt2'][i % 3]}">${initials(p.name)}</span><span style="min-width:0"><b>${esc(p.name)}</b><small class="tnum">${dayAppts.filter((a) => a.pid === p.id).length} visits</small></span></div>`).join('')}</div>
          <div class="sched-body" style="grid-template-columns:${cols};height:${H}px;--hour:${60 * PX}px">
            <div class="tcol">${ticks.join('')}</div>
            ${ps.map((p) => `<div class="pcol">${h.lunch ? `<div class="lunch" style="top:${(h.lunch[0] - top) * PX}px;height:${(h.lunch[1] - h.lunch[0]) * PX}px">Lunch</div>` : ''}${dayAppts.filter((a) => a.pid === p.id).map((a) => {
              const s = new Date(a.start), t = typeById(a.type), y = (minOf(s) - top) * PX, hh = a.dur * PX - 3;
              return `<button class="appt st-${a.status} ${UI.desk.fresh === a.id ? 'fresh' : ''}" style="top:${y}px;height:${hh}px;--c:${t.color}" data-act="appt" data-id="${a.id}" aria-label="${esc(a.patient)}, ${t.name}, ${fmtTime(s)}"><span class="tags">${a.source === 'online' ? '<span class="dot" title="Booked online" style="background:var(--brand)"></span>' : ''}${a.isNew ? '<span class="dot" title="New patient" style="background:#2563EB"></span>' : ''}${a.paid ? '<span class="dot" title="Booking fee paid" style="background:var(--gold)"></span>' : ''}${a.prep ? '<span class="dot" title="Pre-visit answers in" style="background:#15803D"></span>' : ''}</span><b>${esc(a.patient)}</b>${hh > 34 ? `<small class="tnum">${fmtTime(s)} · ${t.name}</small>` : ''}${hh > 56 ? `<small>${STATUS[a.status][1]}</small>` : ''}</button>`;
            }).join('')}</div>`).join('')}
            ${nowLine}
          </div></div></div>
        <div class="legend"><span><i class="dot" style="background:var(--brand)"></i>Booked online</span><span><i class="dot" style="background:#2563EB"></i>New patient</span><span><i class="dot" style="background:var(--gold)"></i>€${FEE} fee paid online</span><span><i class="dot" style="background:#15803D"></i>Pre-visit answers in</span></div></div>
        <div class="panel"><div class="panel-h"><h2>Live activity</h2><span class="pill ok">Live</span></div><ul class="feed">${S.feed.slice(0, 7).map((f) => `<li class="${f.fresh ? 'fresh' : ''}"><span class="fi">${ICONS[f.icon]}</span><span>${f.text}<time>${ago(f.at)}</time></span></li>`).join('')}</ul></div></div>`;
    }
  } else if (UI.desk.tab === 'recalls') {
    content = `<div class="panel"><div class="panel-h"><h2>Patients due for a hygiene visit</h2><button class="btn sm" data-act="recall-all" ${recallDue ? '' : 'disabled'}>Text all due patients</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Last hygiene visit</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>` +
      S.recalls.map((r) => `<tr><td><b>${esc(r.patient)}</b><br><span class="note tnum">${r.phone}</span></td><td class="num">${fmtDay(new Date(r.last))}</td><td class="num">${fmtDay(new Date(r.due))}</td><td>${r.status === 'booked' ? '<span class="pill ok">Booked</span>' : r.status === 'sent' ? '<span class="pill info">Text sent</span>' : '<span class="pill warn">Due</span>'}</td><td style="text-align:right">${r.status === 'due' ? `<button class="btn sm ghost" data-act="recall" data-id="${r.id}">Send recall text</button>` : ''}</td></tr>`).join('') +
      `</tbody></table></div><p class="note" style="padding:12px 16px;border-top:1px solid var(--line)">Patients get a text with a link that opens the booking page with their hygiene visit already selected.</p></div>`;
  } else {
    content = `<div class="panel"><div class="panel-h"><h2>Automatic reminders</h2><span class="note">Sent for every visit, no staff time</span></div><ul class="rem-list">` +
      S.reminders.map((r) => `<li class="rem"><div class="when">${r.when}<small>${r.sub}</small></div><div><span class="pill mute">${r.ch}</span><p>${r.text}</p></div><label class="switch" title="Turn on or off"><input type="checkbox" id="rem-${r.id}" data-act="rem" data-id="${r.id}" ${r.on ? 'checked' : ''}><span></span><b class="sr">${r.when}</b></label></li>`).join('') +
      `</ul></div><div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Preview: 2-day reminder</h2></div><div style="padding:16px"><div class="bubble">Apex Dental: Hi Maria, a reminder of your check-up with ${esc(S.settings.providers[2].name)} at Trident Park on ${fmtDay(addDays(today0, 2))} at 10:30. Reply C to confirm or R to reschedule.</div></div></div>`;
  }
  el.innerHTML = `<div class="fd-top"><h1>Front desk</h1><div class="clinic-sw" role="group" aria-label="Clinic">${CLINICS.map((c) => `<button data-act="dclinic" data-id="${c.id}" aria-pressed="${cl === c.id}">${c.short}</button>`).join('')}</div>
      ${UI.desk.tab === 'schedule' ? `<div class="daynav"><button class="icon-btn" data-act="dprev" aria-label="Previous day">${ICONS.left}</button><span class="cal-wrap"><button class="cal-btn" data-act="calopen" aria-haspopup="dialog" aria-expanded="${!!UI.desk.cal}">${ICONS.cal}<b>${isToday ? 'Today, ' + fmtDay(day) : fmtDay(day)}</b><span aria-hidden="true" class="caret">▾</span></button>${UI.desk.cal ? calPop() : ''}</span><button class="icon-btn" data-act="dnext" aria-label="Next day">${ICONS.right}</button>${isToday ? '' : '<button class="btn sm ghost" data-act="dtoday">Today</button>'}</div>` : ''}</div>
    <div class="sample-note"><b>Sample day, fictional patients.</b> A few example visits show how a normal day looks${UI.desk.fresh ? '. The appointment you just booked is highlighted' : '. Book an appointment on the Patient booking tab and it appears here instantly'}.</div>
    <div class="kpis">
      <div class="kpi"><small>Visits ${isToday ? 'today' : 'this day'}</small><b>${dayAppts.length}</b><i>${dayAppts.filter((a) => a.status === 'checked-in').length} checked in now</i></div>
      <div class="kpi"><small>Booked online this week</small><b>${onlineWeek}</b><i>No phone call or WhatsApp needed</i></div>
      <div class="kpi"><small>Not yet confirmed</small><b>${unconf}</b><i>Next 3 days · reminders running</i></div>
      <div class="kpi"><small>Booking fees paid online</small><b class="tnum">€${feesWeek}</b><i>This week · both clinics</i></div>
    </div>
    <div class="subtabs" role="tablist">
      <button class="subtab" role="tab" data-act="dtab" data-t="schedule" aria-selected="${UI.desk.tab === 'schedule'}">Schedule</button>
      <button class="subtab" role="tab" data-act="dtab" data-t="recalls" aria-selected="${UI.desk.tab === 'recalls'}">Recalls <span class="pill warn tnum">${recallDue}</span></button>
      <button class="subtab" role="tab" data-act="dtab" data-t="reminders" aria-selected="${UI.desk.tab === 'reminders'}">Reminders</button>
    </div>${content}`;
  if (UI.desk.fresh && UI.desk.tab === 'schedule' && !UI.desk.scrolled) {
    const f = el.querySelector('.appt.fresh'); if (f) { UI.desk.scrolled = true; setTimeout(() => f.scrollIntoView({ block: 'center', behavior: 'smooth' }), 120); }
  }
}
function calPop() {
  const m = UI.desk.cal.month, first = new Date(m.getFullYear(), m.getMonth(), 1);
  const lead = (first.getDay() + 6) % 7; // weeks start on Monday
  const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let d = 1; d <= n; d++) {
    const day = new Date(m.getFullYear(), m.getMonth(), d), open = !!hours(day, UI.desk.clinic);
    const count = S.appts.filter((a) => a.clinic === UI.desk.clinic && a.status !== 'cancelled' && sameDay(new Date(a.start), day)).length;
    cells.push(`<button class="cal-d${sameDay(day, today0) ? ' today' : ''}" data-act="calpick" data-t="${day.getTime()}" aria-pressed="${sameDay(day, UI.desk.day)}" ${open ? '' : 'disabled'} aria-label="${fmtLong(day)}${open ? ', ' + count + ' visits' : ', closed'}">${d}${count ? '<i></i>' : ''}</button>`);
  }
  return `<div class="cal-pop" role="dialog" aria-label="Choose a date"><div class="cal-h"><button class="icon-btn" data-act="calmonth" data-d="-1" aria-label="Previous month">${ICONS.left}</button><b>${m.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</b><button class="icon-btn" data-act="calmonth" data-d="1" aria-label="Next month">${ICONS.right}</button></div>
    <div class="cal-g cal-w">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((w) => `<span>${w}</span>`).join('')}</div><div class="cal-g">${cells.join('')}</div>
    <div class="cal-f"><span><i class="dot" style="background:var(--gold)"></i>Has visits</span><button class="btn sm ghost" data-act="calpick" data-t="${today0.getTime()}">Today</button></div></div>`;
}
const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 6e4)); return m < 1 ? 'Just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };

/* ---------- drawers ---------- */
function openDrawer(html) { const d = document.getElementById('drawer'); d.innerHTML = html; d.hidden = false; document.getElementById('scrim').hidden = false; const f = d.querySelector('input,button'); f && f.focus(); }
function closeDrawer() { document.getElementById('drawer').hidden = true; document.getElementById('scrim').hidden = true; }
function apptDrawer(id) {
  const a = S.appts.find((x) => x.id === id), s = new Date(a.start), t = typeById(a.type), p = prov(a.pid), st = STATUS[a.status];
  openDrawer(`<div class="drawer-h"><h2 id="drawerTitle">${esc(a.patient)}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICONS.x}</button></div>
    <div class="drawer-b"><div class="chip-row" style="margin:0"><span class="pill ${st[0]}">${st[1]}</span>${a.source === 'online' ? '<span class="pill brand">Booked online</span>' : '<span class="pill mute">Booked by phone</span>'}${a.isNew ? '<span class="pill info">New patient</span>' : ''}</div>
      <div class="summary" style="margin:0"><div><span>Visit</span><b>${t.name}</b></div><div><span>Dentist</span><b>${esc(p.name)}</b></div><div><span>When</span><b class="tnum">${fmtLong(s)}, ${fmtTime(s)}</b></div><div><span>Length</span><b class="tnum">${a.dur} min</b></div><div><span>Clinic</span><b>${clinicById(a.clinic).name}</b></div><div><span>Booking fee</span><b>${a.paid ? '€' + FEE + ' paid online' : typeById(a.type).fee ? 'To pay at the clinic' : 'None'}</b></div></div>
      ${a.prep ? `<div><div class="label" style="margin-bottom:8px">Pre-visit answers from the patient</div><div class="prep-sum" style="margin:0">${prepSummary(a.prep).map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div></div>` : (a.isNew ? `<div><div class="label" style="margin-bottom:8px">Pre-visit answers</div><p class="note">Not answered yet. The patient gets a reminder link with their confirmation.</p></div>` : '')}
      <div><div class="label" style="margin-bottom:8px">Messages</div><div class="bubble" style="font-size:13.5px">Confirmation sent by text and email${a.status === 'confirmed' ? '. Patient replied C to confirm.' : '. Waiting for the patient to confirm.'}</div></div></div>
    <div class="drawer-f">${a.status === 'confirmed' || a.status === 'unconfirmed' ? `<button class="btn" data-act="setst" data-id="${a.id}" data-s="checked-in">Check in</button>` : ''}${a.status === 'unconfirmed' ? `<button class="btn ghost" data-act="setst" data-id="${a.id}" data-s="confirmed">Mark confirmed</button>` : ''}${a.status === 'checked-in' ? `<button class="btn" data-act="setst" data-id="${a.id}" data-s="completed">Complete visit</button>` : ''}${['confirmed', 'unconfirmed'].includes(a.status) ? `<button class="btn ghost" data-act="setst" data-id="${a.id}" data-s="no-show">No-show</button><button class="btn ghost" data-act="setst" data-id="${a.id}" data-s="cancelled">Cancel visit</button>` : ''}</div>`);
}

/* ---------- toast ---------- */
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2600); }

/* ===================== events ===================== */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab'); if (tab) { location.hash = tab.dataset.view; return; }
  if (e.target.id === 'scrim') { closeDrawer(); return; }
  if (UI.desk.cal && !e.target.closest('.cal-wrap')) { UI.desk.cal = null; renderDesk(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, b = UI.b;
  switch (act) {
    case 'clinic': UI.b = { clinic: el.dataset.id }; UI.step = 1; renderBooking(); break;
    case 'type': b.type = el.dataset.id; b.pid = null; b.day = null; b.m = null; UI.step = 2; renderBooking(); break;
    case 'prov': b.pid = el.dataset.id || null; b.day = null; b.m = null; UI.step = 3; renderBooking(); break;
    case 'day': b.day = new Date(+el.dataset.t); b.m = null; renderBooking(); break;
    case 'slot': b.m = +el.dataset.m; b.slotPid = el.dataset.pid; renderBooking(); break;
    case 'next': if (b.m != null) { UI.step = 4; renderBooking(); } break;
    case 'back': if (UI.step === 4) readForm(); UI.step = Math.max(0, UI.step - 1); renderBooking(); break;
    case 'kind': readForm(); b.d.kind = el.dataset.k; renderBooking(); break;
    case 'sample': { const f = pick(FIRST), l = pick(LAST); Object.assign(b.d, { first: f, last: l, phone: '79' + (20 + Math.floor(rnd() * 79)) + ' ' + (1000 + Math.floor(rnd() * 8999)), email: (f + '.' + l).toLowerCase() + '@example.com' }); renderBooking(); break; }
    case 'confirm': details(); break;
    case 'prepstart': b.prepStep = 0; b.prep = {}; renderBooking(); toPrep(); break;
    case 'prepopt': { const q = PREP[b.prepStep], v = el.dataset.v; if (q.type === 'multi') { let arr = (b.prep[q.key] || []).slice(); if (v === 'none') arr = arr.includes('none') ? [] : ['none']; else { arr = arr.filter((x) => x !== 'none'); arr = arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]; } b.prep[q.key] = arr; } else b.prep[q.key] = v; renderBooking(); break; }
    case 'prepback': b.prepStep = Math.max(0, b.prepStep - 1); renderBooking(); toPrep(); break;
    case 'prepnext': if (b.prepStep < PREP.length - 1) { b.prepStep++; renderBooking(); toPrep(); } else { const a = S.appts.find((x) => x.id === b.bookedId); a.prep = b.prep; b.prepStep = null; S.feed.unshift({ id: 'fp' + a.id, icon: 'clip', text: `<b>${esc(a.patient)}</b> answered the pre-visit questions for their appointment`, at: Date.now(), fresh: true }); renderBooking(); toast('Saved to the appointment'); } break;
    case 'pay': book(true); toast('€' + FEE + ' booking fee paid (demo)'); break;
    case 'again': UI.b = {}; UI.step = 0; renderBooking(); break;
    case 'todesk': location.hash = 'front-desk'; break;
    case 'phone': UI.phone = el.dataset.v === '1'; renderBooking(); break;
    case 'dprev': case 'dnext': { let d = addDays(UI.desk.day, act === 'dprev' ? -1 : 1); if (!hours(d, UI.desk.clinic)) d = addDays(d, act === 'dprev' ? -1 : 1); UI.desk.day = d; renderDesk(); break; }
    case 'dclinic': UI.desk.clinic = el.dataset.id; if (!hours(UI.desk.day, UI.desk.clinic)) UI.desk.day = addDays(UI.desk.day, 1); renderDesk(); break;
    case 'dtoday': UI.desk.day = new Date(today0); UI.desk.cal = null; renderDesk(); break;
    case 'calopen': UI.desk.cal = UI.desk.cal ? null : { month: new Date(UI.desk.day.getFullYear(), UI.desk.day.getMonth(), 1) }; renderDesk(); break;
    case 'calmonth': { const m = UI.desk.cal.month; UI.desk.cal.month = new Date(m.getFullYear(), m.getMonth() + +el.dataset.d, 1); renderDesk(); break; }
    case 'calpick': UI.desk.day = new Date(+el.dataset.t); UI.desk.cal = null; renderDesk(); break;
    case 'dtab': UI.desk.tab = el.dataset.t; renderDesk(); break;
    case 'appt': apptDrawer(el.dataset.id); break;
    case 'setst': { const a = S.appts.find((x) => x.id === el.dataset.id); a.status = el.dataset.s; S.feed.unshift({ id: 'f' + Date.now(), icon: el.dataset.s === 'checked-in' ? 'user' : 'check', text: `<b>${esc(a.patient)}</b> ${STATUS[a.status][1].toLowerCase()}`, at: Date.now() }); closeDrawer(); renderDesk(); toast(a.patient + ': ' + STATUS[a.status][1]); break; }
    case 'recall': { const r = S.recalls.find((x) => x.id === el.dataset.id); r.status = 'sent'; S.feed.unshift({ id: 'f' + Date.now(), icon: 'msg', text: `Recall text sent to <b>${esc(r.patient)}</b>`, at: Date.now() }); renderDesk(); toast('Recall text sent to ' + r.patient); break; }
    case 'recall-all': { let n = 0; S.recalls.forEach((r) => { if (r.status === 'due') { r.status = 'sent'; n++; } }); S.feed.unshift({ id: 'f' + Date.now(), icon: 'msg', text: `Recall texts sent to <b>${n} patients</b>`, at: Date.now() }); renderDesk(); toast(`Recall texts sent to ${n} patients`); break; }
    case 'close': closeDrawer(); break;
    case 'resetdemo': seedData(); UI.b = {}; UI.step = 0; UI.desk = { tab: 'schedule', day: new Date(today0), fresh: null, clinic: 'tp' }; closeDrawer(); setView(UI.view); toast('Demo reset'); break;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.act === 'rem') { const r = S.reminders.find((x) => x.id === e.target.dataset.id); r.on = e.target.checked; toast(r.when + ' reminder ' + (r.on ? 'on' : 'off')); }
});
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (UI.desk.cal) { UI.desk.cal = null; renderDesk(); } else if (!document.getElementById('drawer').hidden) closeDrawer(); });

/* ===================== start ===================== */
seedData(); applyBrand(); setView(location.hash.slice(1) || 'booking');
setInterval(() => { if (UI.view === 'front-desk' && UI.desk.tab === 'schedule' && !UI.desk.cal && document.getElementById('drawer').hidden) { const y = window.scrollY; renderDesk(); window.scrollTo(0, y); } }, 60000);
</script>

</body>
</html>
