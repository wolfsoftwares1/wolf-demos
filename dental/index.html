<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://www.wolfsoftwares.com/favicon.svg" type="image/svg+xml">
<title>Dental Booking Demo · Wolf Softwares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: white, single light theme. App bar with two views (patient booking / front desk) + a customize drawer. Clinic brand color is a live token. */
:root{
  --brand:#0F766E; --brand-ink:#FFFFFF;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#14201F; --muted:#5E6B6C; --faint:#94A0A1; --line:#E6EBEB; color-scheme:light;
  --ok:#15803D; --ok-bg:#E8F6EE; --warn:#B45309; --warn-bg:#FDF3E3; --bad:#B91C1C; --bad-bg:#FDECEC; --info:#1D4ED8; --info-bg:#EAF0FE;
  --shadow:0 1px 2px rgba(16,32,34,.06),0 8px 24px rgba(16,32,34,.06);
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tint:color-mix(in srgb,var(--brand) 7%,#FFFFFF);
  --tint-2:color-mix(in srgb,var(--brand) 13%,#FFFFFF);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* demo ribbon + app bar */
.ribbon{background:var(--ink);color:var(--bg);font-size:12.5px}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.ribbon b{font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15}
.brand-sub{font-size:12.5px;color:var(--muted)}
.demo-pill{vertical-align:2px;font-family:var(--f-body)}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.icon-btn:hover{border-color:var(--brand)}
.icon-btn svg{width:18px;height:18px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--f-display);background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;border-radius:9px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .pill.brand{background:var(--tint-2);color:var(--ink)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
main{padding-block:24px 64px}
[hidden]{display:none!important}

/* ---------- PATIENT BOOKING ---------- */
.book-col{max-width:600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stage>*{min-width:0}
.bk-tools{display:flex;align-items:center;gap:14px;justify-content:space-between}
.hint{margin:0;font-size:13.5px;color:var(--muted);min-width:0}
.hint b{color:var(--ink);font-weight:600}
.seg.mini{flex:none;padding:2px}.seg.mini button{padding:6px 10px;display:grid;place-items:center}.seg.mini svg{width:18px;height:18px}
.when-line{margin:-4px 0 14px}
.done{text-align:center;padding:8px 0 18px}.done .done-ic{margin:0 auto 12px}.done h2{font-size:22px}.done .note{margin-top:4px}
.done-when{font-family:var(--f-display);font-weight:700;font-size:18px;margin:10px 0 0}
.stage{display:flex;justify-content:center}
.bk{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.bk-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.bk-head h1{font-size:22px}
.bk-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;margin-top:14px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--brand)}
.bk-body{padding:18px 22px 22px}
.bk-q{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 12px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand);background:var(--tint)}
.opt .ic{width:40px;height:40px;border-radius:50%;background:var(--tint);display:grid;place-items:center;flex:none;color:var(--brand)}
.opt .ic svg{width:22px;height:22px}
.opt b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt .meta{margin-left:auto;text-align:right;flex:none;font-size:12.5px;color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:var(--brand-ink);background:var(--brand);flex:none}
.av.alt{background:color-mix(in srgb,var(--brand) 55%,#334155)} .av.alt2{background:color-mix(in srgb,var(--brand) 40%,#7C3AED)}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;margin-bottom:14px}
.date{flex:none;width:64px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;text-align:center}
.date small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.date b{display:block;font-family:var(--f-display);font-size:19px}
.date i{display:block;font-style:normal;font-size:11px;color:var(--faint)}
.date[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.date[aria-pressed="true"] small,.date[aria-pressed="true"] i{color:inherit;opacity:.85}
.date:disabled{opacity:.4}
.slot-group{margin-bottom:14px}
.slot-group .label{margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:600;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--brand)}
.slot[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2)}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--brand)}
.summary{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;font-size:14px}
.summary div{display:flex;justify-content:space-between;gap:12px}
.summary span{color:var(--muted)}
.summary b{text-align:right}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.fill{border:0;background:none;color:var(--brand);font-weight:700;padding:0}
.done-ic{width:58px;height:58px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.done-ic svg{width:30px;height:30px}
.msgs{display:grid;gap:12px;margin-top:16px}
.sms{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.sms .from{font-size:12px;color:var(--faint);margin-bottom:6px}
.bubble{background:color-mix(in srgb,var(--muted) 14%,var(--surface));border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14px;max-width:420px}
.email{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.email-top{background:var(--brand);color:var(--brand-ink);padding:10px 14px;font-weight:700;font-family:var(--f-display)}
.email-b{padding:12px 14px;background:var(--surface)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* phone frame */
.phone{width:390px;max-width:100%;border:10px solid #0d1416;border-radius:46px;box-shadow:0 30px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;background:var(--surface)}
.phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:#0d1416;z-index:2}
.phone .bk{border:0;border-radius:0;box-shadow:none;max-width:none;max-height:760px;overflow-y:auto}
.phone .bk-head{padding-top:46px}
.phone .form{grid-template-columns:1fr}
/* how it works side panel */
.how{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:90px}
.how h2{font-size:16px;margin-bottom:4px}
.how p{color:var(--muted);font-size:14px;margin:0 0 12px}
.how ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:flex;gap:10px;font-size:14px}
.how li svg{width:18px;height:18px;flex:none;color:var(--brand);margin-top:2px}
.how .now{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}

/* ---------- FRONT DESK ---------- */
.fd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.fd-top h1{font-size:24px;margin-right:auto}
.daynav{display:flex;align-items:center;gap:6px}
.daynav b{min-width:170px;text-align:center;font-family:var(--f-display)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:14px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi i{font-style:normal;font-size:12.5px;color:var(--faint)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtab{border:0;background:none;padding:10px 14px;font-weight:700;font-family:var(--f-display);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.subtab .pill{margin-left:6px}
.fd-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1060px){.fd-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px}
.sched-scroll{overflow-x:auto}
.sched{display:grid;min-width:640px;position:relative}
.sched-head{display:grid;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sched-head div{padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.sched-head .av{width:30px;height:30px;font-size:12px}
.sched-head b{display:block;font-size:13.5px;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-head small{display:block;font-size:12px;color:var(--muted)}
.sched-body{display:grid;position:relative}
.tcol{position:relative;border-right:1px solid var(--line)}
.tcol span{position:absolute;right:8px;font-size:11.5px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.pcol{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.pcol:last-child{border-right:0}
.lunch{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);color:var(--faint);font-size:11.5px;display:flex;align-items:center;justify-content:center}
.appt{position:absolute;left:5px;right:5px;border-radius:9px;padding:5px 8px 5px 11px;border:1px solid var(--line);background:var(--surface);text-align:left;overflow:hidden;font-size:12.5px;line-height:1.3;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.appt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.appt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.st-checked-in{background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.appt.st-no-show{opacity:.55;text-decoration:line-through}
.appt.st-completed{opacity:.7}
.appt.st-unconfirmed{border-style:dashed}
.appt.fresh{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent);animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--brand) 18%,transparent)}}
.appt .tags{position:absolute;top:5px;right:6px;display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:1}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.feed{list-style:none;margin:0;padding:6px 0;max-height:640px;overflow:auto}
.feed li{display:flex;gap:10px;padding:10px 16px;font-size:13.5px}
.feed li+li{border-top:1px solid var(--line)}
.feed .fi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint-2);color:var(--brand)}
.feed .fi svg{width:16px;height:16px}
.feed time{display:block;font-size:12px;color:var(--faint)}
.feed li.fresh{background:var(--tint)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rem-list{list-style:none;margin:0;padding:0}
.rem{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
@media (max-width:640px){.rem{grid-template-columns:1fr}}
.rem .when{font-family:var(--f-display);font-weight:700;font-size:14px}
.rem .when small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12.5px}
.rem p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;border-radius:24px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(18px)}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(5,12,13,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;box-shadow:-20px 0 50px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:18px}
.drawer-b{padding:18px 20px;overflow:auto;display:grid;gap:14px;align-content:start}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.foot{color:var(--faint);font-size:12.5px;text-align:center;padding-block:10px 28px}
@media (max-width:640px){.cust-l{display:none}.tabs{order:3;width:100%}.tab{flex:1}.brand-sub{display:none}.daynav b{min-width:0}}
</style>
</head>
<body>

<header class="bar"><div class="wrap">
  <div class="brand"><div class="logo" id="logo"></div><div style="min-width:0"><div class="brand-name"><span id="bname"></span> <span class="pill mute demo-pill">Demo</span></div><div class="brand-sub" id="bsub"></div></div></div>
  <div class="tabs" role="tablist" aria-label="Demo view">
    <button class="tab" role="tab" id="tab-booking" data-view="booking">Patient booking</button>
    <button class="tab" role="tab" id="tab-desk" data-view="front-desk">Front desk</button>
  </div>

<script>
/* ===================== data ===================== */
const ICONS = {

  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9h18"/></svg>',
};
const TYPES = [
  { id:'clean', name:'Check-up & cleaning', dur:60, icon:'tooth', color:'#0EA5A0', desc:'Exam, cleaning and X-rays if they are due' },
  { id:'newpt', name:'New patient exam', dur:75, icon:'clip', color:'#2563EB', desc:'Full exam, X-rays and a treatment plan' },
  { id:'emerg', name:'Tooth pain or emergency', dur:30, icon:'bolt', color:'#DC2626', desc:'Same-day times kept free for urgent care' },
  { id:'kids', name:"Children's check-up", dur:45, icon:'child', color:'#D97706', desc:'Gentle exam and cleaning for ages 3–12' },
  { id:'white', name:'Whitening consultation', dur:30, icon:'sparkle', color:'#9333EA', desc:'Shade check and options, no obligation' },
  { id:'align', name:'Clear aligner consultation', dur:45, icon:'align', color:'#0891B2', desc:'Scan, photos and a straightening plan' },
];
const typeById = (id) => TYPES.find((t) => t.id === id);
const DEFAULT_SETTINGS = {
  name:'Brightsmile Dental', city:'Austin, TX', phone:'(512) 555-0142', color:'#0F766E', logo:'',
  providers:[
    { id:'p1', name:'Dr. Emily Carter', role:'General dentist', types:['clean','newpt','emerg','kids','white'] },
    { id:'p2', name:'Dr. Marcus Reed', role:'Cosmetic & general dentist', types:['newpt','emerg','white','align'] },
    { id:'p3', name:'Sarah Lopez, RDH', role:'Dental hygienist', types:['clean','kids'] },
  ],
};
const COLORS = ['#0F766E','#0369A1','#1D4ED8','#7C3AED','#BE185D','#B45309','#15803D','#334155'];
const FIRST = ['Olivia','Liam','Emma','Noah','Ava','Ethan','Sophia','Mason','Isabella','Lucas','Mia','Logan','Amelia','James','Harper','Aiden','Evelyn','Elijah','Abigail','Carter','Emily','Wyatt','Ella','Jack','Avery','Owen','Scarlett','Caleb','Grace','Henry','Chloe','Daniel','Riley','Jackson','Zoey','Levi','Nora','Mateo','Lily','Gabriel'];
const LAST = ['Johnson','Martinez','Nguyen','Brown','Garcia','Miller','Davis','Rodriguez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Lee','Perez','Thompson','White','Harris','Sanchez','Clark','Ramirez','Lewis','Robinson','Walker','Young','Allen','King','Wright','Scott','Hill','Green','Adams','Baker','Nelson'];
const INSURERS = ['Delta Dental','Cigna Dental','MetLife','Aetna Dental','Guardian','United Concordia','Other insurance','No insurance (self-pay)'];

/* seeded random so the demo looks the same on every open */
let seed = 20261031;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ===================== time helpers ===================== */
const DAY = 864e5;
const today0 = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const fmtTime = (d) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtDay = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLong = (d) => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
function hours(d) { // opening hours in minutes from midnight, null when closed
  const w = d.getDay();
  if (w === 0) return null;
  if (w === 6) return { open: 540, close: 780, lunch: null };
  return { open: 480, close: 1020, lunch: [720, 780] };
}
const atMin = (d, m) => { const x = new Date(d); x.setHours(0, m, 0, 0); return x; };
const minOf = (d) => d.getHours() * 60 + d.getMinutes();

/* ===================== state ===================== */
let S = { settings: structuredClone(DEFAULT_SETTINGS), appts: [], feed: [], recalls: [], reminders: null };
const UI = { view: 'booking', phone: false, step: 0, b: {}, desk: { tab: 'schedule', day: new Date(today0), fresh: null }, };
try { const s = JSON.parse(localStorage.getItem('dentalDemoSettings') || 'null'); if (s && s.providers) S.settings = s; } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('dentalDemoSettings', JSON.stringify(S.settings)); } catch (e) {} };
const prov = (id) => S.settings.providers.find((p) => p.id === id);
const initials = (n) => n.replace(/^Dr\.\s*/, '').split(/[\s,]+/).filter((w) => /^[A-Z]/.test(w)).slice(0, 2).map((w) => w[0]).join('');
const pname = () => pick(FIRST) + ' ' + pick(LAST);
let idc = 1;

function seedData() {
  seed = 20261031; idc = 1;
  const appts = [];
  for (let k = -4; k <= 14; k++) {
    const day = addDays(today0, k), h = hours(day);
    if (!h) continue;
    for (const p of S.settings.providers) {
      let m = h.open + (rnd() < .5 ? 0 : 30);
      while (m < h.close) {
        if (h.lunch && m >= h.lunch[0] && m < h.lunch[1]) { m = h.lunch[1]; continue; }
        const fill = k < 0 ? .78 : k === 0 ? .72 : Math.max(.25, .7 - k * .035);
        if (rnd() < fill) {
          const t = typeById(pick(p.types));
          const dur = t.dur;
          if (m + dur > h.close || (h.lunch && m < h.lunch[0] && m + dur > h.lunch[0])) { m += 30; continue; }
          const start = atMin(day, m);
          let status;
          const now = new Date();
          if (k < 0) status = rnd() < .08 ? 'no-show' : 'completed';
          else if (k === 0) status = start < now ? (rnd() < .07 ? 'no-show' : (start.getTime() + dur * 6e4 < now.getTime() ? 'completed' : 'checked-in')) : (rnd() < .82 ? 'confirmed' : 'unconfirmed');
          else status = rnd() < (k < 3 ? .7 : .55) ? 'confirmed' : 'unconfirmed';
          appts.push({ id: 'a' + idc++, pid: p.id, patient: pname(), type: t.id, start: start.getTime(), dur, status, source: rnd() < .42 ? 'online' : 'phone', isNew: t.id === 'newpt' });
          m += Math.ceil(dur / 30) * 30;
        } else m += 30;
      }
    }
  }
  S.appts = appts;
  const now = Date.now();
  const recent = appts.filter((a) => a.source === 'online' && a.start > now).slice(0, 4);
  S.feed = [
    ...recent.map((a, i) => ({ id: 'f' + i, icon: 'cal', text: `<b>${a.patient}</b> booked <b>${typeById(a.type).name}</b> online for ${fmtDay(new Date(a.start))}, ${fmtTime(new Date(a.start))}`, at: now - (i * 47 + 12) * 6e4 })),
    { id: 'fr1', icon: 'msg', text: `Reminder texts sent to <b>14 patients</b> for tomorrow`, at: now - 95 * 6e4 },
    { id: 'fr2', icon: 'check', text: `<b>${pname()}</b> confirmed by text (replied C)`, at: now - 130 * 6e4 },
    { id: 'fr3', icon: 'user', text: `<b>${pname()}</b> completed new-patient forms online`, at: now - 190 * 6e4 },
  ].sort((a, b) => b.at - a.at);
  S.recalls = Array.from({ length: 9 }, (_, i) => {
    const last = addDays(today0, -(170 + Math.floor(rnd() * 40)));
    return { id: 'r' + i, patient: pname(), phone: '(512) 555-0' + (110 + i * 7), last: last.getTime(), due: addDays(last, 182).getTime(), status: i < 2 ? 'booked' : i < 4 ? 'sent' : 'due' };
  });
  S.reminders = [
    { id: 'confirm', when: 'Right away', sub: 'after booking', ch: 'Text + email', on: true, text: 'Booking confirmation with date, time, provider, address and a link to reschedule.' },
    { id: 'forms', when: 'Right away', sub: 'new patients only', ch: 'Email', on: true, text: 'Link to complete medical history and insurance forms online before the visit.' },
    { id: 'd2', when: '2 days before', sub: 'at 10:00 AM', ch: 'Text', on: true, text: 'Reminder asking the patient to reply C to confirm or R to reschedule.' },
    { id: 'h2', when: '2 hours before', sub: '', ch: 'Text', on: true, text: 'Final reminder with parking and arrival instructions.' },
    { id: 'review', when: 'After the visit', sub: 'same evening', ch: 'Text', on: false, text: 'Thank-you message with a link to leave a Google review.' },
    { id: 'recall', when: '6 months later', sub: 'cleaning due', ch: 'Text + email', on: true, text: 'Recall reminder with a one-tap link to book the next cleaning.' },
  ];
}

/* ===================== brand ===================== */
function applyBrand() {
  const st = S.settings, root = document.documentElement;
  root.style.setProperty('--brand', st.color);
  const c = st.color.replace('#', ''); const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  root.style.setProperty('--brand-ink', (r * 299 + g * 587 + b * 114) / 1000 > 160 ? '#0B1213' : '#FFFFFF');
  document.getElementById('bname').textContent = st.name;
  document.getElementById('bsub').textContent = st.city + ' · ' + st.phone;
  document.getElementById('logo').innerHTML = st.logo ? `<img src="${st.logo}" alt="${esc(st.name)} logo">` : `<span style="width:22px;height:22px;display:block">${ICONS.tooth}</span>`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ===================== views ===================== */
function setView(v) {
  UI.view = v === 'front-desk' ? 'front-desk' : 'booking';
  document.getElementById('tab-booking').setAttribute('aria-selected', UI.view === 'booking');
  document.getElementById('tab-desk').setAttribute('aria-selected', UI.view === 'front-desk');
  document.getElementById('v-booking').hidden = UI.view !== 'booking';
  document.getElementById('v-desk').hidden = UI.view !== 'front-desk';
  if (UI.view === 'booking') renderBooking(); else renderDesk();
}
window.addEventListener('hashchange', () => setView(location.hash.slice(1)));

/* ---------- availability ---------- */
function freeSlots(day, typeId, pid) {
  const h = hours(day); if (!h) return [];
  const t = typeById(typeId), dur = t.dur;
  const provs = S.settings.providers.filter((p) => p.types.includes(typeId) && (!pid || p.id === pid));
  const now = Date.now(), out = new Map();
  for (const p of provs) {
    const busy = S.appts.filter((a) => a.pid === p.id && a.status !== 'cancelled' && sameDay(new Date(a.start), day));
    for (let m = h.open; m + dur <= h.close; m += 15) {
      if (m % 30 && typeId !== 'emerg') continue;
      if (h.lunch && m < h.lunch[1] && m + dur > h.lunch[0]) continue;
      const s = atMin(day, m).getTime(), e = s + dur * 6e4;
      if (s < now + 60 * 6e4) continue;
      if (busy.some((a) => s < a.start + a.dur * 6e4 && e > a.start)) continue;
      if (!out.has(m)) out.set(m, p.id);
    }
  }
  return [...out.entries()].sort((a, b) => a[0] - b[0]).map(([m, p]) => ({ m, pid: p }));
}
function firstAvailable(typeId, pid) {
  for (let k = 0; k < 21; k++) { const d = addDays(today0, k); const s = freeSlots(d, typeId, pid); if (s.length) return { day: d, slot: s[0] }; }
  return null;
}

/* ---------- patient booking ---------- */
const HOW = [
  { t: 'Patients choose the visit', d: 'Each visit type has its own length, so the schedule never overbooks a chair.' },
  { t: 'Any dentist or a favorite', d: 'Patients can pick a provider or take the first free time. Each provider only shows the visits they do.' },
  { t: 'Only real free times', d: 'Times come straight from the live schedule. Lunch, existing visits and short-notice times are hidden automatically.' },
  { t: 'Details and insurance', d: 'New and returning patients fill in what the front desk needs, including insurance, before they arrive.' },
  { t: 'Booked and on the schedule', d: 'The visit lands on the front desk calendar instantly, and the patient gets a text and an email straight away.' },
];
function renderBooking() {
  const st = UI.step, b = UI.b, el = document.getElementById('v-booking');
  const titles = ['What do you need?', 'Who would you like to see?', 'Pick a day and time', 'Your details', "You're booked"];
  let body = '';
  const back = st > 0 && st < 4 ? `<button class="back" data-act="back">${ICONS.left} Back</button>` : '';
  if (st === 0) {
    body = `<p class="bk-q">${titles[0]}</p><div class="opts">` + TYPES.map((t) => {
      const fa = t.id === 'emerg' ? firstAvailable(t.id) : null;
      return `<button class="opt" data-act="type" data-id="${t.id}"><span class="ic">${ICONS[t.icon]}</span><span style="min-width:0"><b>${t.name}</b><small>${t.desc}</small></span><span class="meta"><span class="tnum">${t.dur} min</span>${fa && sameDay(fa.day, today0) ? '<br><span class="pill ok">Today</span>' : ''}</span></button>`;
    }).join('') + `</div>`;
  } else if (st === 1) {
    const t = typeById(b.type);
    const ps = S.settings.providers.filter((p) => p.types.includes(t.id));
    const any = firstAvailable(t.id);
    body = `${back}<p class="bk-q">${titles[1]}</p><div class="opts">
      <button class="opt" data-act="prov" data-id=""><span class="ic">${ICONS.bolt}</span><span><b>First available</b><small>${any ? 'Earliest: ' + fmtDay(any.day) + ', ' + fmtTime(atMin(any.day, any.slot.m)) : 'Fastest way to get seen'}</small></span></button>` +
      ps.map((p) => { const fa = firstAvailable(t.id, p.id); return `<button class="opt" data-act="prov" data-id="${p.id}"><span class="av ${['', 'alt', 'alt2'][S.settings.providers.indexOf(p) % 3]}">${initials(p.name)}</span><span style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.role)}${fa ? ' · next ' + fmtDay(fa.day) : ''}</small></span></button>`; }).join('') + `</div>`;
  } else if (st === 2) {
    if (!b.day) { const fa = firstAvailable(b.type, b.pid); b.day = fa ? fa.day : new Date(today0); }
    const days = Array.from({ length: 14 }, (_, k) => addDays(today0, k)).filter((d) => hours(d));
    const slots = freeSlots(b.day, b.type, b.pid);
    const groups = [['Morning', (m) => m < 720], ['Afternoon', (m) => m >= 720]];
    body = `${back}<p class="bk-q">${titles[2]}</p><div class="dates" role="group" aria-label="Choose a day">` + days.map((d) => {
      const n = freeSlots(d, b.type, b.pid).length;
      return `<button class="date" data-act="day" data-t="${d.getTime()}" aria-pressed="${sameDay(d, b.day)}" ${n ? '' : 'disabled'}><small>${d.toLocaleDateString('en-US', { weekday: 'short' })}</small><b class="tnum">${d.getDate()}</b><i>${d.toLocaleDateString('en-US', { month: 'short' })}</i></button>`;
    }).join('') + `</div>` + (slots.length ? groups.map(([g, f]) => { const ss = slots.filter((s) => f(s.m)); return ss.length ? `<div class="slot-group"><div class="label">${g}</div><div class="slots">` + ss.map((s) => `<button class="slot" data-act="slot" data-m="${s.m}" data-pid="${s.pid}" aria-pressed="${b.m === s.m}">${fmtTime(atMin(b.day, s.m))}</button>`).join('') + `</div></div>` : ''; }).join('') : `<div class="empty">No open times this day. Try another date.</div>`) +
      `<div class="actions"><span class="note">${b.m != null ? esc(prov(b.slotPid).name) + ' · ' + fmtDay(b.day) + ', ' + fmtTime(atMin(b.day, b.m)) : ''}</span><button class="btn" data-act="next" ${b.m == null ? 'disabled' : ''}>Continue</button></div>`;
  } else if (st === 3) {
    const d = b.d || (b.d = { kind: 'new', first: '', last: '', phone: '', email: '', ins: '', sms: true });
    body = `${back}<p class="bk-q">${titles[3]}</p>
      <p class="note when-line">${typeById(b.type).name} · ${esc(prov(b.slotPid).name)} · <span class="tnum">${fmtDay(b.day)}, ${fmtTime(atMin(b.day, b.m))}</span></p>
      <div class="seg" role="group" aria-label="Patient type" style="margin-bottom:14px"><button data-act="kind" data-k="new" aria-pressed="${d.kind === 'new'}">I'm a new patient</button><button data-act="kind" data-k="ret" aria-pressed="${d.kind === 'ret'}">I've been here before</button></div>
      <form class="form" id="dform" novalidate>
        <div class="field"><label for="f-first">First name</label><input id="f-first" name="first" autocomplete="off" value="${esc(d.first)}" required></div>
        <div class="field"><label for="f-last">Last name</label><input id="f-last" name="last" autocomplete="off" value="${esc(d.last)}" required></div>
        <div class="field"><label for="f-phone">Mobile number</label><input id="f-phone" name="phone" inputmode="tel" autocomplete="off" value="${esc(d.phone)}" required></div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="off" value="${esc(d.email)}"></div>
        <div class="field full"><label for="f-ins">Dental insurance</label><select id="f-ins" name="ins"><option value="">Choose…</option>${INSURERS.map((i) => `<option ${d.ins === i ? 'selected' : ''}>${i}</option>`).join('')}</select></div>
        <label class="check full" for="f-sms"><input type="checkbox" id="f-sms" name="sms" ${d.sms ? 'checked' : ''}> Text me reminders about this visit</label>
      </form>
      <div class="actions"><button class="fill" data-act="sample">Fill sample patient</button><button class="btn" data-act="confirm">Book appointment</button></div>`;
  } else {
    const a = S.appts.find((x) => x.id === b.bookedId), when = new Date(a.start), p = prov(a.pid), d = b.d;
    body = `<div class="done"><span class="done-ic">${ICONS.check}</span><h2>You're booked, ${esc(d.first)}!</h2>
      <p class="note">${typeById(a.type).name} with ${esc(p.name)}</p>
      <p class="done-when tnum">${fmtLong(when)} · ${fmtTime(when)}</p></div>
      <div class="sms"><div class="from">Text sent to ${esc(d.phone || 'the patient')}</div><div class="bubble">${esc(S.settings.name)}: Hi ${esc(d.first)}, you're booked on ${fmtDay(when)} at ${fmtTime(when)} with ${esc(p.name)}. Reply C to confirm or R to reschedule.</div></div>
      <div class="actions"><button class="btn ghost" data-act="again">Book another</button><button class="btn" data-act="todesk">See it on the front desk ${ICONS.right}</button></div>`;
  }
  const steps = `<div class="steps" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<span class="${i <= st ? 'on' : ''}"></span>`).join('')}</div>`;
  const card = `<div class="bk"><div class="bk-head"><h1>Book an appointment</h1><p>${esc(S.settings.name)} · ${esc(S.settings.city)}</p>${steps}</div><div class="bk-body">${body}</div></div>`;
  const tools = `<div class="bk-tools"><p class="hint"><b>${HOW[st].t}.</b> ${HOW[st].d}</p><div class="seg mini" role="group" aria-label="Preview size"><button data-act="phone" data-v="0" aria-pressed="${!UI.phone}">${ICONS.web}<span class="sr">Website</span></button><button data-act="phone" data-v="1" aria-pressed="${UI.phone}">${ICONS.phone}<span class="sr">Phone</span></button></div></div>`;
  el.innerHTML = `<div class="book-col">${tools}<div class="stage">${UI.phone ? `<div class="phone">${card}</div>` : card}</div></div>`;
}

function readForm() {
  const f = document.getElementById('dform'); if (!f) return;
  const d = UI.b.d;
  ['first', 'last', 'phone', 'email', 'ins'].forEach((k) => { if (f.elements[k]) d[k] = f.elements[k].value.trim(); });
  d.sms = f.elements.sms.checked;
}

function book() {
  readForm();
  const b = UI.b, d = b.d;
  if (!d.first || !d.last || !d.phone) { toast('Add first name, last name and mobile number to book.'); return; }
  const start = atMin(b.day, b.m).getTime();
  const a = { id: 'a' + idc++, pid: b.slotPid, patient: d.first + ' ' + d.last, type: b.type, start, dur: typeById(b.type).dur, status: 'confirmed', source: 'online', isNew: d.kind === 'new', ins: d.ins, phone: d.phone };
  S.appts.push(a);
  S.feed.unshift({ id: 'f' + a.id, icon: 'cal', text: `<b>${esc(a.patient)}</b> booked <b>${typeById(a.type).name}</b> online for ${fmtDay(new Date(start))}, ${fmtTime(new Date(start))}`, at: Date.now(), fresh: true });
  b.bookedId = a.id; UI.desk.fresh = a.id; UI.desk.scrolled = false; UI.desk.day = new Date(b.day); UI.desk.tab = 'schedule';
  UI.step = 4; renderBooking();
}

/* ---------- front desk ---------- */
const STATUS = { 'confirmed': ['ok', 'Confirmed'], 'unconfirmed': ['warn', 'Not confirmed'], 'checked-in': ['info', 'Checked in'], 'completed': ['mute', 'Completed'], 'no-show': ['bad', 'No-show'], 'cancelled': ['mute', 'Cancelled'] };
function renderDesk() {
  const el = document.getElementById('v-desk'), day = UI.desk.day, ps = S.settings.providers;
  const dayAppts = S.appts.filter((a) => sameDay(new Date(a.start), day) && a.status !== 'cancelled');
  const weekStart = addDays(today0, -today0.getDay());
  const onlineWeek = S.appts.filter((a) => a.source === 'online' && a.start >= weekStart.getTime() && a.start < addDays(weekStart, 7).getTime()).length;
  const unconf = S.appts.filter((a) => a.status === 'unconfirmed' && a.start > Date.now() && a.start < addDays(today0, 3).getTime()).length;
  const recallDue = S.recalls.filter((r) => r.status === 'due').length;
  const noShow = (() => { const past = S.appts.filter((a) => a.start < Date.now() && ['completed', 'no-show'].includes(a.status)); return past.length ? Math.round(100 * past.filter((a) => a.status === 'no-show').length / past.length) : 0; })();
  const isToday = sameDay(day, today0);
  let content = '';
  if (UI.desk.tab === 'schedule') {
    const h = hours(day);
    if (!h) content = `<div class="panel"><div class="empty" style="margin:16px">Closed on ${fmtLong(day)}.</div></div>`;
    else {
      const PX = 1.3, top = h.open, H = (h.close - h.open) * PX;
      const cols = `56px repeat(${ps.length}, minmax(180px,1fr))`;
      const ticks = []; for (let m = h.open; m <= h.close; m += 60) ticks.push(`<span style="top:${(m - top) * PX}px">${fmtTime(atMin(day, m)).replace(':00', '')}</span>`);
      const nowM = minOf(new Date());
      const nowLine = isToday && nowM > h.open && nowM < h.close ? `<div class="nowline" style="top:${(nowM - top) * PX}px;grid-column:2/-1"></div>` : '';
      content = `<div class="fd-grid"><div class="panel"><div class="panel-h"><h2>${fmtLong(day)}</h2><span class="note">Click a visit to check in or confirm</span></div>
        <div class="sched-scroll"><div class="sched">
          <div class="sched-head" style="grid-template-columns:${cols}"><div></div>${ps.map((p, i) => `<div><span class="av ${['', 'alt', 'alt2'][i % 3]}">${initials(p.name)}</span><span style="min-width:0"><b>${esc(p.name)}</b><small class="tnum">${dayAppts.filter((a) => a.pid === p.id).length} visits</small></span></div>`).join('')}</div>
          <div class="sched-body" style="grid-template-columns:${cols};height:${H}px;--hour:${60 * PX}px">
            <div class="tcol">${ticks.join('')}</div>
            ${ps.map((p) => `<div class="pcol">${h.lunch ? `<div class="lunch" style="top:${(h.lunch[0] - top) * PX}px;height:${(h.lunch[1] - h.lunch[0]) * PX}px">Lunch</div>` : ''}${dayAppts.filter((a) => a.pid === p.id).map((a) => {
              const s = new Date(a.start), t = typeById(a.type), y = (minOf(s) - top) * PX, hh = a.dur * PX - 3;
              return `<button class="appt st-${a.status} ${UI.desk.fresh === a.id ? 'fresh' : ''}" style="top:${y}px;height:${hh}px;--c:${t.color}" data-act="appt" data-id="${a.id}" aria-label="${esc(a.patient)}, ${t.name}, ${fmtTime(s)}"><span class="tags">${a.source === 'online' ? '<span class="dot" title="Booked online" style="background:var(--brand)"></span>' : ''}${a.isNew ? '<span class="dot" title="New patient" style="background:#2563EB"></span>' : ''}</span><b>${esc(a.patient)}</b>${hh > 34 ? `<small class="tnum">${fmtTime(s)} · ${t.name}</small>` : ''}${hh > 56 ? `<small>${STATUS[a.status][1]}</small>` : ''}</button>`;
            }).join('')}</div>`).join('')}
            ${nowLine}
          </div></div></div>
        <div class="legend"><span><i class="dot" style="background:var(--brand)"></i>Booked online</span><span><i class="dot" style="background:#2563EB"></i>New patient</span></div></div>
        <div class="panel"><div class="panel-h"><h2>Live activity</h2><span class="pill ok">Live</span></div><ul class="feed">${S.feed.slice(0, 7).map((f) => `<li class="${f.fresh ? 'fresh' : ''}"><span class="fi">${ICONS[f.icon]}</span><span>${f.text}<time>${ago(f.at)}</time></span></li>`).join('')}</ul></div></div>`;
    }
  } else if (UI.desk.tab === 'recalls') {
    content = `<div class="panel"><div class="panel-h"><h2>Patients due for a cleaning</h2><button class="btn sm" data-act="recall-all" ${recallDue ? '' : 'disabled'}>Text all due patients</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Last cleaning</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>` +
      S.recalls.map((r) => `<tr><td><b>${esc(r.patient)}</b><br><span class="note tnum">${r.phone}</span></td><td class="num">${fmtDay(new Date(r.last))}</td><td class="num">${fmtDay(new Date(r.due))}</td><td>${r.status === 'booked' ? '<span class="pill ok">Booked</span>' : r.status === 'sent' ? '<span class="pill info">Text sent</span>' : '<span class="pill warn">Due</span>'}</td><td style="text-align:right">${r.status === 'due' ? `<button class="btn sm ghost" data-act="recall" data-id="${r.id}">Send recall text</button>` : ''}</td></tr>`).join('') +
      `</tbody></table></div><p class="note" style="padding:12px 16px;border-top:1px solid var(--line)">Patients get a text with a link that opens the booking page with their cleaning already selected.</p></div>`;
  } else {
    content = `<div class="panel"><div class="panel-h"><h2>Automatic reminders</h2><span class="note">Sent for every visit, no staff time</span></div><ul class="rem-list">` +
      S.reminders.map((r) => `<li class="rem"><div class="when">${r.when}<small>${r.sub}</small></div><div><span class="pill mute">${r.ch}</span><p>${r.text}</p></div><label class="switch" title="Turn on or off"><input type="checkbox" id="rem-${r.id}" data-act="rem" data-id="${r.id}" ${r.on ? 'checked' : ''}><span></span><b class="sr">${r.when}</b></label></li>`).join('') +
      `</ul></div><div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Preview: 2-day reminder</h2></div><div style="padding:16px"><div class="bubble">${esc(S.settings.name)}: Hi Olivia, a reminder of your check-up & cleaning with ${esc(S.settings.providers[0].name)} on ${fmtDay(addDays(today0, 2))} at 10:30 AM. Reply C to confirm or R to reschedule.</div></div></div>`;
  }
  el.innerHTML = `<div class="fd-top"><h1>Front desk</h1>
      ${UI.desk.tab === 'schedule' ? `<div class="daynav"><button class="icon-btn" data-act="dprev" aria-label="Previous day">${ICONS.left}</button><b>${isToday ? 'Today' : fmtDay(day)}</b><button class="icon-btn" data-act="dnext" aria-label="Next day">${ICONS.right}</button>${isToday ? '' : '<button class="btn sm ghost" data-act="dtoday">Today</button>'}</div>` : ''}</div>
    <div class="kpis">
      <div class="kpi"><small>Visits ${isToday ? 'today' : 'this day'}</small><b>${dayAppts.length}</b><i>${dayAppts.filter((a) => a.status === 'checked-in').length} checked in now</i></div>
      <div class="kpi"><small>Booked online this week</small><b>${onlineWeek}</b><i>Without a phone call</i></div>
      <div class="kpi"><small>Not yet confirmed</small><b>${unconf}</b><i>Next 3 days · reminders running</i></div>
      <div class="kpi"><small>No-shows</small><b>${noShow}%</b><i>Last 4 days</i></div>
    </div>
    <div class="subtabs" role="tablist">
      <button class="subtab" role="tab" data-act="dtab" data-t="schedule" aria-selected="${UI.desk.tab === 'schedule'}">Schedule</button>
      <button class="subtab" role="tab" data-act="dtab" data-t="recalls" aria-selected="${UI.desk.tab === 'recalls'}">Recalls <span class="pill warn tnum">${recallDue}</span></button>
      <button class="subtab" role="tab" data-act="dtab" data-t="reminders" aria-selected="${UI.desk.tab === 'reminders'}">Reminders</button>
    </div>${content}`;
  if (UI.desk.fresh && UI.desk.tab === 'schedule' && !UI.desk.scrolled) {
    const f = el.querySelector('.appt.fresh'); if (f) { UI.desk.scrolled = true; setTimeout(() => f.scrollIntoView({ block: 'center', behavior: 'smooth' }), 120); }
  }
}
const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 6e4)); return m < 1 ? 'Just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };

/* ---------- drawers ---------- */
function openDrawer(html) { const d = document.getElementById('drawer'); d.innerHTML = html; d.hidden = false; document.getElementById('scrim').hidden = false; const f = d.querySelector('input,button'); f && f.focus(); }
function closeDrawer() { document.getElementById('drawer').hidden = true; document.getElementById('scrim').hidden = true; }
function apptDrawer(id) {
  const a = S.appts.find((x) => x.id === id), s = new Date(a.start), t = typeById(a.type), p = prov(a.pid), st = STATUS[a.status];
  openDrawer(`<div class="drawer-h"><h2 id="drawerTitle">${esc(a.patient)}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICONS.x}</button></div>
    <div class="drawer-b"><div class="chip-row" style="margin:0"><span class="pill ${st[0]}">${st[1]}</span>${a.source === 'online' ? '<span class="pill brand">Booked online</span>' : '<span class="pill mute">Booked by phone</span>'}${a.isNew ? '<span class="pill info">New patient</span>' : ''}</div>
      <div class="summary" style="margin:0"><div><span>Visit</span><b>${t.name}</b></div><div><span>Provider</span><b>${esc(p.name)}</b></div><div><span>When</span><b class="tnum">${fmtLong(s)}, ${fmtTime(s)}</b></div><div><span>Length</span><b class="tnum">${a.dur} min</b></div><div><span>Insurance</span><b>${esc(a.ins || pick(INSURERS.slice(0, 6)))}</b></div></div>
      <div><div class="label" style="margin-bottom:8px">Messages</div><div class="bubble" style="font-size:13.5px">Confirmation sent by text and email${a.status === 'confirmed' ? '. Patient replied C to confirm.' : '. Waiting for the patient to confirm.'}</div></div></div>
    <div class="drawer-f">${a.status === 'confirmed' || a.status === 'unconfirmed' ? `<button class="btn" data-act="setst" data-id="${a.id}" data-s="checked-in">Check in</button>` : ''}${a.status === 'unconfirmed' ? `<button class="btn ghost" data-act="setst" data-id="${a.id}" data-s="confirmed">Mark confirmed</button>` : ''}${a.status === 'checked-in' ? `<button class="btn" data-act="setst" data-id="${a.id}" data-s="completed">Complete visit</button>` : ''}${['confirmed', 'unconfirmed'].includes(a.status) ? `<button class="btn ghost" data-act="setst" data-id="${a.id}" data-s="no-show">No-show</button><button class="btn ghost" data-act="setst" data-id="${a.id}" data-s="cancelled">Cancel visit</button>` : ''}</div>`);
}
function settingsDrawer() {
  const st = S.settings;
  openDrawer(`<div class="drawer-h"><h2 id="drawerTitle">Customize demo</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICONS.x}</button></div>
    <form class="drawer-b" id="sform">
      <p class="note">Set this up before a call so the prospect sees their own practice. Saved in this browser only.</p>
      <div class="field"><label for="s-name">Practice name</label><input id="s-name" name="name" value="${esc(st.name)}"></div>
      <div class="field"><label for="s-city">City, state</label><input id="s-city" name="city" value="${esc(st.city)}"></div>
      <div class="field"><label for="s-phone">Phone number</label><input id="s-phone" name="phone" value="${esc(st.phone)}"></div>
      <div class="field"><label>Brand color</label><div class="swatches">${COLORS.map((c) => `<button type="button" class="sw" data-act="color" data-c="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${st.color.toLowerCase() === c.toLowerCase()}"></button>`).join('')}<input type="color" id="s-color" name="color" value="${st.color}" aria-label="Custom color" style="width:40px;height:32px;border:0;background:none;padding:0"></div></div>
      <div class="field"><label for="s-logo">Logo (PNG, JPG or SVG)</label><input type="file" id="s-logo" accept="image/*">${st.logo ? '<button type="button" class="fill" data-act="nologo" style="margin-top:6px">Remove logo</button>' : ''}</div>
      ${st.providers.map((p, i) => `<div class="field"><label for="s-p${i}">Provider ${i + 1} · ${esc(p.role)}</label><input id="s-p${i}" name="p${i}" value="${esc(p.name)}"></div>`).join('')}
    </form>
    <div class="drawer-f"><button class="btn" data-act="savesettings">Apply</button><button class="btn ghost" data-act="resetdemo">Reset demo</button></div>`);
}

/* ---------- toast ---------- */
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2600); }

/* ===================== events ===================== */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab'); if (tab) { location.hash = tab.dataset.view; return; }
  if (e.target.closest('#openSettings')) { settingsDrawer(); return; }
  if (e.target.id === 'scrim') { closeDrawer(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, b = UI.b;
  switch (act) {
    case 'type': UI.b = { type: el.dataset.id }; UI.step = 1; renderBooking(); break;
    case 'prov': b.pid = el.dataset.id || null; b.day = null; b.m = null; UI.step = 2; renderBooking(); break;
    case 'day': b.day = new Date(+el.dataset.t); b.m = null; renderBooking(); break;
    case 'slot': b.m = +el.dataset.m; b.slotPid = el.dataset.pid; renderBooking(); break;
    case 'next': if (b.m != null) { UI.step = 3; renderBooking(); } break;
    case 'back': if (UI.step === 3) readForm(); UI.step = Math.max(0, UI.step - 1); renderBooking(); break;
    case 'kind': readForm(); b.d.kind = el.dataset.k; renderBooking(); break;
    case 'sample': { const f = pick(FIRST), l = pick(LAST); Object.assign(b.d, { first: f, last: l, phone: '(512) 555-01' + (10 + Math.floor(rnd() * 89)), email: (f + '.' + l).toLowerCase() + '@example.com', ins: 'Delta Dental' }); renderBooking(); break; }
    case 'confirm': book(); break;
    case 'again': UI.b = {}; UI.step = 0; renderBooking(); break;
    case 'todesk': location.hash = 'front-desk'; break;
    case 'phone': UI.phone = el.dataset.v === '1'; renderBooking(); break;
    case 'dprev': case 'dnext': { let d = addDays(UI.desk.day, act === 'dprev' ? -1 : 1); if (!hours(d)) d = addDays(d, act === 'dprev' ? -1 : 1); UI.desk.day = d; UI.desk.fresh = UI.desk.fresh; renderDesk(); break; }
    case 'dtoday': UI.desk.day = new Date(today0); renderDesk(); break;
    case 'dtab': UI.desk.tab = el.dataset.t; renderDesk(); break;
    case 'appt': apptDrawer(el.dataset.id); break;
    case 'setst': { const a = S.appts.find((x) => x.id === el.dataset.id); a.status = el.dataset.s; S.feed.unshift({ id: 'f' + Date.now(), icon: el.dataset.s === 'checked-in' ? 'user' : 'check', text: `<b>${esc(a.patient)}</b> ${STATUS[a.status][1].toLowerCase()}`, at: Date.now() }); closeDrawer(); renderDesk(); toast(a.patient + ': ' + STATUS[a.status][1]); break; }
    case 'recall': { const r = S.recalls.find((x) => x.id === el.dataset.id); r.status = 'sent'; S.feed.unshift({ id: 'f' + Date.now(), icon: 'msg', text: `Recall text sent to <b>${esc(r.patient)}</b>`, at: Date.now() }); renderDesk(); toast('Recall text sent to ' + r.patient); break; }
    case 'recall-all': { let n = 0; S.recalls.forEach((r) => { if (r.status === 'due') { r.status = 'sent'; n++; } }); S.feed.unshift({ id: 'f' + Date.now(), icon: 'msg', text: `Recall texts sent to <b>${n} patients</b>`, at: Date.now() }); renderDesk(); toast(`Recall texts sent to ${n} patients`); break; }
    case 'close': closeDrawer(); break;
    case 'color': { document.getElementById('s-color').value = el.dataset.c; document.querySelectorAll('.sw').forEach((s) => s.setAttribute('aria-pressed', s === el)); break; }
    case 'nologo': S.settings.logo = ''; saveSettings(); applyBrand(); settingsDrawer(); break;
    case 'savesettings': {
      const f = document.getElementById('sform'), st = S.settings;
      st.name = f.elements.name.value.trim() || DEFAULT_SETTINGS.name; st.city = f.elements.city.value.trim(); st.phone = f.elements.phone.value.trim();
      st.color = f.elements.color.value; st.providers.forEach((p, i) => { p.name = f.elements['p' + i].value.trim() || p.name; });
      saveSettings(); applyBrand(); closeDrawer(); setView(UI.view); toast('Demo updated for ' + st.name); break;
    }
    case 'resetdemo': S.settings = structuredClone(DEFAULT_SETTINGS); saveSettings(); seedData(); UI.b = {}; UI.step = 0; UI.desk = { tab: 'schedule', day: new Date(today0), fresh: null }; applyBrand(); closeDrawer(); setView(UI.view); toast('Demo reset'); break;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.act === 'rem') { const r = S.reminders.find((x) => x.id === e.target.dataset.id); r.on = e.target.checked; toast(r.when + ' reminder ' + (r.on ? 'on' : 'off')); }
  if (e.target.id === 's-logo' && e.target.files[0]) {
    const file = e.target.files[0];
    if (file.size > 1.5e6) { toast('Choose a logo under 1.5 MB.'); return; }
    const fr = new FileReader(); fr.onload = () => { S.settings.logo = fr.result; saveSettings(); applyBrand(); toast('Logo added'); }; fr.readAsDataURL(file);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('drawer').hidden) closeDrawer(); });

/* ===================== start ===================== */
seedData(); applyBrand(); setView(location.hash.slice(1) || 'booking');
setInterval(() => { if (UI.view === 'front-desk' && UI.desk.tab === 'schedule' && document.getElementById('drawer').hidden) { const y = window.scrollY; renderDesk(); window.scrollTo(0, y); } }, 60000);
</script>

</body>
</html>
